[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feax"
version = "0.8.0"
description = "A GPU-accelerated finite element analysis framework with JAX."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Naruki-Ichihara", email = "ichihara.naruki@nihon-u.ac.jp"},
]
maintainers = [
    {name = "Naruki-Ichihara", email = "ichihara.naruki@nihon-u.ac.jp"},
]
keywords = ["JAX", "CUDA", "Simulation", "PINN", "finite-element", "FEA", "GPU"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "fenics-basix",
    "equinox",
    "optax",
    "scikit-image",
    "pyvista",
    "tetgen",
    "asdex",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
sksparse = [
    "scikit-sparse",
]
matfree = [
    "matfree",
]

amg = [
    "amjax",
    "pyamg",
]
# Kept so `pip install feax[mesh]` goes on working: TetGen is a core
# dependency now, because `sphere_mesh` and `cylinder_mesh` are part of the
# meshing API rather than an add-on, and an ImportError from a documented
# constructor is a worse answer than a 407 kB wheel. Unlike the Gmsh extra
# below, TetGen ships manylinux/macOS/Windows wheels and pulls in nothing but
# NumPy, which is already required.
mesh = []
# Optional Gmsh backend, only for feax.gene adaptive remeshing and
# SDF/density -> volume-mesh extraction. Core meshing no longer needs it.
gmsh = [
    "gmsh",
]
# Differentiable CAD front end, used as a PREPROCESSOR: the SDF grammar defines
# the geometry and feax solves it on a fixed StructuredGrid, so shape parameters
# carry sensitivity without the mesh ever moving. See
# examples/experimental/sdf_shape_optimization.py. Not on PyPI; installed from
# source. Only cadjoint's CAD layer is needed -- its own `fem` extra (jax-fem,
# gmsh, petsc4py) is not, and is deliberately not pulled in here.
cad = [
    "cadjoint @ git+https://github.com/andrinr/cadjoint.git",
]
# CUDA runtime libraries only. JAX itself is not pinned by any extra: install
# jax / jax[cuda12] / jax[cuda13] first (or use the NVCR container's JAX).
cuda12 = [
    "nvidia-cudss-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-nvcc-cu12",
    "nanobind",
    "scikit-build-core>=0.5",
    "ninja",
    "cmake"
]
cuda13 = [
    "nvidia-cudss-cu13",
    "nvidia-cublas",
    "nvidia-cuda-cccl",
    "nvidia-cuda-runtime",
    "nvidia-cudnn-cu13",
    "nvidia-cuda-nvcc",
    "nanobind",
    "scikit-build-core>=0.5",
    "ninja",
    "cmake"
]

[project.urls]
Homepage = "https://github.com/Naruki-Ichihara/feax"
Documentation = "https://github.com/Naruki-Ichihara/feax"
Repository = "https://github.com/Naruki-Ichihara/feax.git"
Issues = "https://github.com/Naruki-Ichihara/feax/issues"

[tool.setuptools]
py-modules = []
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["feax*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
